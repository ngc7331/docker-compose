services:
  app:
    container_name: bili-sync
    image: ${DOCKER_MIRROR:-docker.io}/${DOCKER_IMAGE:-amtoaer/bili-sync-rs}:${DOCKER_TAG:-latest}
    restart: unless-stopped
    networks:
      - default
    ports: []
    volumes:
      - config:/app/.config/bili-sync
      - ${VOLUME_PATH_DATA:-data}:/data
    environment:
      - TZ
      - PUID
      - PGID

volumes:
  config:
  data:

networks:
  default:
    external: true
    name: ${DOCKER_NETWORK:-br}
